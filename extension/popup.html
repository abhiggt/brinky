<!doctype html>
<html>
<head><meta charset="utf-8"><title>Brinky</title><link rel="stylesheet" href="popup.css"></head>
<body>
<div id="app">

  <!-- Home -->
  <section id="home" class="view">
    <header class="hello">
      <button class="buddy" id="buddy" title="Say hi to Brinky" aria-label="Brinky"></button>
      <div class="bubble" role="status" aria-live="polite"><p id="say">Hi!</p></div>
      <button class="icon" id="openSettings" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <div class="cards" id="cards">
      <div class="card eye">
        <div class="ctitle">Blink</div>
        <div class="ring">
          <svg width="92" height="92" viewBox="0 0 92 92">
            <circle class="tr" cx="46" cy="46" r="40"/><circle class="br" id="bar" cx="46" cy="46" r="40"/></svg>
          <div class="c"><div class="t" id="time">--:--</div></div>
        </div>
        <div class="csub" id="eyeSub">20 s · look far away</div>
      </div>

      <div class="card drink">
        <div class="ctitle">Drink</div>
        <div class="glassrow">
          <svg class="glass" id="glass" width="56" height="70" viewBox="0 0 56 70" aria-hidden="true">
            <defs><clipPath id="gclip"><path d="M6 6 L50 6 L45 64 Q44.5 67 41 67 L15 67 Q11.5 67 11 64 Z"/></clipPath></defs>
            <g clip-path="url(#gclip)">
              <rect x="0" y="0" width="56" height="70" class="gbg"/>
              <g id="gfill" style="transform:translateY(70px)"><path id="gwave" d="M-56 4 Q-42 0 -28 4 T0 4 T28 4 T56 4 T84 4 V80 H-56 Z" class="gwater"/></g>
            </g>
            <path d="M6 6 L50 6 L45 64 Q44.5 67 41 67 L15 67 Q11.5 67 11 64 Z" fill="none" class="gline" stroke-width="2"/>
            <path d="M12 12 L15 58" stroke="#fff" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <div class="gnum"><b id="glasses">0</b><span id="goal">/ 8</span></div>
        </div>
        <div class="csub" id="waterSub">Next wave in 30 min</div>
        <div class="gbtns">
          <button class="mini" id="unlog" title="Undo a glass" aria-label="Remove a glass">−</button>
          <button class="mini add" id="log">+ Glass</button>
        </div>
      </div>
    </div>

    <div class="row" id="actions">
      <button class="btn pri" id="now">Rest my eyes now</button>
      <button class="btn" id="pauseBtn">Pause</button>
    </div>
    <button class="wm" id="workMode" role="switch" aria-checked="false"><span class="wmt"><b>Work mode</b><small id="wmSub">Fewer, longer breaks for deep work</small></span><span class="tg" aria-hidden="true"></span></button>
    <div class="menu" id="pauseMenu" hidden>
      <button class="chip" data-pause="15">15 min</button><button class="chip" data-pause="60">1 hour</button><button class="chip" data-pause="tomorrow">Until tomorrow morning</button><button class="chip" id="skipNext">Skip next break</button>
    </div>
    <button class="btn pri wide" id="turnOn" hidden>Wake Brinky up</button>

    <div class="card week">
      <div class="whead"><span class="ctitle">This week</span><span class="streak" id="streak"></span></div>
      <div class="days" id="days"></div>
    </div>

    <footer class="today"><div id="since"></div><div id="today"></div></footer>
  </section>

  <!-- Settings are drawn by settings.js; SuperBrink settings open on their own page -->
  <section id="settings" class="view" hidden></section>
</div>
<script src="mascot.js"></script>
<script type="module" src="popup.js"></script>
</body>
</html>
